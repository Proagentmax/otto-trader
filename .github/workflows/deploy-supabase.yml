# Otto Trader — deploy the server side on push (added v3.14, 6 Oct 2026).
# A push to main that changes supabase/otto-proxy.ts, a supabase/NNN_*.sql file, or this workflow:
#   1. runs the test suite — if any test fails, nothing is deployed;
#   2. runs every SQL file not yet in the otto_migrations ledger, once, in order (Supabase Management API);
#   3. deploys the otto-proxy Edge Function (JWT verification stays ON, as today).
# The app itself (index.html, sw.js) still goes live through GitHub Pages on the same push.
# Needs one repository secret, added by Ifoma: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Nothing is pushed without Ifoma's "ship it".
name: Deploy Supabase (otto-proxy + SQL)
on:
  push:
    branches: [main]
    paths: ["supabase/otto-proxy.ts", "supabase/[0-9][0-9][0-9]_*.sql", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch: {}
concurrency: { group: supabase-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: loykixugjltxukuvbbuf
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Token present?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first"; exit 1; fi

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Tests must pass before anything deploys
        run: deno test -A --no-check supabase/tests/

      - name: Did the server code change?
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- supabase/otto-proxy.ts .github/workflows/deploy-supabase.yml; then
            echo "proxy=false" >> "$GITHUB_OUTPUT"
          else
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          fi

      # SQL ledger: the table otto_migrations remembers which supabase/NNN_*.sql files have run.
      # Any file not in it runs once, in number order, and is then recorded. On the very first run the
      # ledger is seeded with 002-012 (already run by hand before automation existed), so 013+ run here.
      - name: Run SQL migrations not yet applied
        run: |
          q() { jq -n --arg q "$1" '{query: $q}' > q.json
                curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json; }
          SEED_THROUGH=12
          seed=$(ls supabase/[0-9][0-9][0-9]_*.sql | xargs -n1 basename | awk -v t=$SEED_THROUGH '{ if ($0+0 <= t) printf "%s'\''%s'\''", (n++?",":""), $0 }')
          q "create table if not exists public.otto_migrations (name text primary key, applied_at timestamptz not null default now());
             alter table public.otto_migrations enable row level security;
             revoke all on public.otto_migrations from anon, authenticated;
             insert into public.otto_migrations (name)
               select unnest(array[$seed]::text[]) where not exists (select 1 from public.otto_migrations);" > /dev/null
          q "select name from public.otto_migrations order by name" | jq -r '.[].name' | sort > applied.txt
          echo "Already applied:"; cat applied.txt
          ls supabase/[0-9][0-9][0-9]_*.sql | sort | while read -r f; do
            n=$(basename "$f")
            grep -qxF "$n" applied.txt && continue
            echo "== running $n"
            jq -Rs '{query: .}' "$f" > q.json
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json
            echo
            q "insert into public.otto_migrations (name) values ('$n') on conflict do nothing" > /dev/null
            echo "== recorded $n"
          done

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.proxy == 'true'
        with: { version: latest }
      - name: Deploy the otto-proxy Edge Function
        if: steps.changed.outputs.proxy == 'true'
        run: |
          mkdir -p supabase/functions/otto-proxy
          cp supabase/otto-proxy.ts supabase/functions/otto-proxy/index.ts
          supabase functions deploy otto-proxy --project-ref "$PROJECT_REF"
          echo "Deployed otto-proxy $(sha256sum supabase/otto-proxy.ts | cut -c1-16)"
